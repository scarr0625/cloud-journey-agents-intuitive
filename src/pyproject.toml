[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-journey-agents"
version = "0.1.0"
description = "Shared infrastructure and safety rules for Cloud Journey agents"
requires-python = ">=3.11"
dependencies = [
  "truststore>=0.10,<1",
  "google-auth[requests]>=2.47,<3",
  "httpx>=0.27,<1",
  "mcp>=1.26,<2",
  "python-dotenv>=1,<2",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
batch = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
chat = [
  # Keep the ADK release aligned with migrations/session-state/000_adk_sessions.sql.
  "google-adk==2.9.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloud_journey_agents*"]
namespaces = false
