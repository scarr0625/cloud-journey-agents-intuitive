[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ad-provisioning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cloud-journey-agents[batch]==0.1.0"]

[tool.setuptools]
packages = ["agent_ad_provisioning"]

[tool.setuptools.package-dir]
agent_ad_provisioning = "app"
