[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ad-provisioning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["journey-mcp==0.1.0", "python-dotenv>=1,<2", "journey-durability==0.1.0"]

[tool.setuptools]
packages = ["agent_ad_provisioning"]

[tool.setuptools.package-dir]
agent_ad_provisioning = "app"
