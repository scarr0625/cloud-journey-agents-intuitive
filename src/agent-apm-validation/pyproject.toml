[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-apm-validation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cloud-journey-agents[batch]==0.1.0"]

[tool.setuptools]
packages = ["agent_apm_validation"]

[tool.setuptools.package-dir]
agent_apm_validation = "app"
