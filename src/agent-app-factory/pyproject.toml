[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-app-factory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["journey-mcp==0.1.0", "python-dotenv>=1,<2", "journey-durability==0.1.0"]

[tool.setuptools]
packages = ["agent_app_factory"]

[tool.setuptools.package-dir]
agent_app_factory = "app"
