[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-assistant"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["journey-mcp==0.1.0", "python-dotenv>=1,<2", "journey-sessions==0.1.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools]
packages = ["agent_assistant"]

[tool.setuptools.package-dir]
agent_assistant = "app"
