services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloud-journey-db
      POSTGRES_USER: journey
      POSTGRES_PASSWORD: journey
    ports:
      - "5432:5432"
    volumes:
      - journey-postgres-data:/var/lib/postgresql/data
      - ./scripts/init_databases.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journey -d cloud-journey-db"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  journey-postgres-data:
