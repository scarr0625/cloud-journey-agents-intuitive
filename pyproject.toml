[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-journey-poc"
version = "0.1.0"
description = "Durable Cloud Journey state machine PoC using Google ADK and PostgreSQL"
requires-python = ">=3.11"
dependencies = [
  "truststore>=0.10,<1",
  "mcp>=1.26,<2",
  # The checked-in session schema is verified against this ADK release.
  "google-adk==2.9.2",
  "aiosqlite>=0.20,<1.0",
  "google-auth[requests]>=2.47,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn>=0.30,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.1,<4.0",
  "cloud-sql-python-connector[pg8000]>=1.18,<2.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# The root distribution is for local development/testing only. Each image installs
# its agent distribution and the shared package with its required dependency extras.
[tool.setuptools]
packages = ["cloud_journey_agents", "cloud_journey_agents.durability", "cloud_journey_agents.sessions", "agent_apm_validation", "agent_ad_provisioning", "agent_app_factory", "agent_assistant", "agent_orchestrator", "journey_poc", "journey_poc.cloud_journey", "workflows", "schwab_mcp_persistence"]

[tool.setuptools.package-dir]
"cloud_journey_agents" = "src/cloud_journey_agents"
"agent_apm_validation" = "src/agent-apm-validation/app"
"agent_ad_provisioning" = "src/agent-ad-provisioning/app"
"agent_app_factory" = "src/agent-app-factory/app"
"agent_assistant" = "src/agent-assistant/app"
"agent_orchestrator" = "src/agent-orchestrator/app"
"journey_poc" = "examples/local-business/journey_poc"
"journey_poc.cloud_journey" = "examples/local-business/journey_poc/cloud_journey"
"workflows" = "workflows"
"schwab_mcp_persistence" = "references/schwab-mcp/schwab_mcp_persistence"
