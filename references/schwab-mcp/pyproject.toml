[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schwab-mcp-persistence-reference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["SQLAlchemy>=2,<3", "psycopg[binary]>=3.1,<4", "pydantic>=2,<3", "google-adk==2.9.2"]

[tool.setuptools.packages.find]
include = ["schwab_mcp_persistence*"]
