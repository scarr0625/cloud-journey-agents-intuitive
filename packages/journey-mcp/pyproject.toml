[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.26,<2", "httpx>=0.27,<1", "google-auth>=2.47,<3"]

[tool.setuptools]
packages = ["journey_mcp"]

[tool.setuptools.package-dir]
journey_mcp = "journey_mcp"
