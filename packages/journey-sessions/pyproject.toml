[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "journey-sessions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["google-adk>=2.7,<3", "aiosqlite>=0.20,<1", "psycopg[binary]>=3.1,<4"]

[tool.setuptools]
packages = ["journey_sessions"]

[tool.setuptools.package-dir]
journey_sessions = "journey_sessions"
